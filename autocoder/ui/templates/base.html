<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}AutoCoder{% endblock %}</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Helvetica Neue", Arial, sans-serif; margin: 0; color: #1a1a1a;
         background: #f5f8f8; }
  header { background: #0D6E6E; color: #fff; padding: 12px 24px;
           display: flex; align-items: center; gap: 24px; }
  header a { color: #cfe8e8; text-decoration: none; font-weight: 600; }
  header a:hover { color: #fff; }
  header .brand { font-size: 18px; font-weight: 700; color: #fff; }
  main { max-width: 1200px; margin: 24px auto; padding: 0 24px; }
  .card { background: #fff; border: 1px solid #dbe5e5; border-radius: 10px;
          padding: 20px 24px; margin-bottom: 20px; }
  h1 { color: #0D4F4F; font-size: 22px; margin-top: 0; }
  h2 { color: #0D6E6E; font-size: 16px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { background: #0D6E6E; color: #fff; text-align: left; padding: 7px 10px; }
  td { border-bottom: 1px solid #e5eded; padding: 7px 10px; vertical-align: top; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 12px;
           font-size: 12px; font-weight: 700; }
  .badge.auto { background: #dff0df; color: #2e6b2e; }
  .badge.needs_review { background: #fdeaea; color: #a03a30; }
  .badge.first { background: #0D6E6E; color: #fff; }
  button, .btn { background: #0D6E6E; color: #fff; border: none; padding: 9px 18px;
           border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
  button:hover { background: #0A5656; }
  input, select { padding: 8px; border: 1px solid #c6d4d4; border-radius: 6px;
                  font-size: 14px; }
  label { display: block; font-weight: 600; margin: 12px 0 4px; font-size: 13px; }
  mark { padding: 1px 2px; border-radius: 3px; cursor: pointer; }
  .conf-bar { background: #e5eded; border-radius: 6px; height: 10px; width: 90px;
              display: inline-block; vertical-align: middle; }
  .conf-bar > div { background: #0D6E6E; height: 10px; border-radius: 6px; }
  details { margin-top: 12px; }
  pre { background: #f0f5f5; padding: 12px; border-radius: 6px; overflow-x: auto;
        font-size: 12px; }
  .cols { display: flex; gap: 20px; align-items: flex-start; }
  .cols .note { flex: 1.2; }
  .cols .codes { flex: 1; }
  .notetext { white-space: normal; line-height: 1.7; font-size: 14px;
              font-family: Menlo, Consolas, monospace; }
</style>
</head>
<body>
<header>
  <span class="brand">AutoCoder</span>
  <a href="/">Upload</a>
  <a href="/charts">Worklist</a>
</header>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
