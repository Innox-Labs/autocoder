[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autocoder"
version = "0.1.0"
description = "AutoCoder prototype: outpatient clinical note -> ICD-10-CM diagnosis codes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    # Clinical NLP foundation (install editable from the sibling checkout during dev:
    #   uv pip install -e "../openmed[hf,grounding,multimodal]")
    "openmed[hf,grounding,multimodal]>=1.8.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "rapidfuzz>=3.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
embed = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
autocoder = "autocoder.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["autocoder"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
